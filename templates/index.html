<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,noarchive"><title>file-drop</title><meta name="csrf-token" content="{{ csrf_token() }}"><link rel="stylesheet" href="/static/files.css?v=20260917f1"><script defer src="/static/lucide.js"></script><script defer src="/static/files.js?v=20260917f1"></script></head><body data-page="index"><a class="skip" href="#content">к содержимому</a><header class="topbar"><a class="brand" href="/"><i data-lucide="files"></i>file-drop</a><nav class="topnav" aria-label="сервисы"><a href="/" aria-current="page">файлы</a></nav></header><div class="shell"><aside class="sidebar" aria-label="коллекции"><p class="side-label">библиотека</p><button data-filter="all" aria-pressed="true"><i data-lucide="layers"></i>всё</button><button data-filter="file" aria-pressed="false"><i data-lucide="files"></i>файлы</button><button data-filter="note" aria-pressed="false"><i data-lucide="notebook-pen"></i>заметки</button><div class="side-bottom"><span class="muted small">{{ user }}</span><form action="/logout" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button type="submit">выйти</button></form></div></aside><main id="content" class="workspace"><div class="heading"><div><h1 id="collection-title">все материалы</h1><p>файлы и заметки в одном рабочем списке.</p></div><div class="actions"><button id="add-note"><i data-lucide="plus"></i>заметка</button><button class="primary" id="add-file"><i data-lucide="upload"></i>загрузить</button></div></div><div class="notice"><i data-lucide="hard-drive"></i><span>файлы между устройствами. ссылка на скачивание работает, пока жив файл.</span></div><div class="toolbar"><label class="searchbox"><span class="label">поиск по имени и заголовку</span><i data-lucide="search"></i><input id="search" type="search" placeholder="найти материал" maxlength="200" autocomplete="off"></label><label class="sort"><span class="label">порядок</span><select id="sort"><option value="name">по имени</option><option value="size">по размеру</option></select></label></div><div class="split"><section class="list-pane" aria-label="список материалов"><div class="list-head"><span>имя / тип</span><span id="count" aria-live="polite"></span></div><div class="items" id="items"></div><noscript>для списка материалов включи javascript</noscript></section><aside class="inspector" id="inspector" aria-label="инспектор материала"></aside></div></main></div><div id="toast" class="toast" role="status" hidden><span id="toast-text"></span><button id="toast-close" class="icon-button" aria-label="закрыть уведомление"><i data-lucide="x"></i></button></div><dialog id="dialog" aria-labelledby="dialog-title"><div class="dialog-heading"><h2 id="dialog-title"></h2><button id="dialog-close" class="icon-button" aria-label="закрыть окно"><i data-lucide="x"></i></button></div><div id="dialog-body"></div><div id="dialog-actions" class="actions"></div></dialog><input type="file" id="file-input" multiple hidden><script id="files-data" type="application/json">{{ files|tojson }}</script><script id="notes-data" type="application/json">{{ notes|tojson }}</script></body></html>
