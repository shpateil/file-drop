<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,noarchive"><title>file-drop</title><meta name="csrf-token" content="{{ csrf_token() }}"><link rel="stylesheet" href="/static/files.css?v=20260917f1"><script defer src="/static/lucide.js"></script><script defer src="/static/files.js?v=20260917f1"></script></head><body data-page="edit" data-delete="{{ url_for('ndel', slug=slug) }}"><a class="skip" href="#content">к содержимому</a><header class="topbar"><a class="brand" href="/"><i data-lucide="files"></i>file-drop</a><nav class="topnav" aria-label="сервисы"><a href="/" aria-current="page">файлы</a></nav></header><header class="topbar editor-top"><a class="button" href="/"><i data-lucide="arrow-left"></i>материалы</a><span class="muted small">редактор</span><div class="actions"><button id="copy-note"><i data-lucide="copy"></i>копировать</button><button id="delete-note"><i data-lucide="trash-2"></i>удалить</button><button class="primary" id="save-note"><i data-lucide="save"></i>сохранить</button></div></header><main id="content" class="editor-layout"><section class="editor"><label for="note-title" class="label">имя заметки</label><input id="note-title" value="{{ slug }}" readonly><div class="editor-status" id="edit-status" role="status">сохранено на сервере</div><label for="note-body" class="label">текст</label><form id="note-form" action="{{ url_for('nsave', slug=slug) }}" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><textarea id="note-body" name="c" placeholder="напиши заметку">{{ content }}</textarea></form></section><aside class="editor-side"><h2>твоя заметка</h2><p class="muted small">первая строка текста будет заголовком в списке материалов.</p><dl class="details"><div><dt>объём</dt><dd id="char-count">0 символов</dd></div><div><dt>сохранить</dt><dd>ctrl / ⌘ + s</dd></div></dl><button id="download-note"><i data-lucide="download"></i>скачать текст</button><p class="small muted">при ошибке текст остаётся в редакторе. сохрани изменения перед выходом.</p></aside></main><div id="toast" class="toast" role="status" hidden><span id="toast-text"></span><button id="toast-close" class="icon-button" aria-label="закрыть уведомление"><i data-lucide="x"></i></button></div><dialog id="dialog" aria-labelledby="dialog-title"><div class="dialog-heading"><h2 id="dialog-title"></h2><button id="dialog-close" class="icon-button" aria-label="закрыть окно"><i data-lucide="x"></i></button></div><div id="dialog-body"></div><div id="dialog-actions" class="actions"></div></dialog></body></html>
